name: PHP Lint

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, fileinfo
          tools: none

      - name: Lint PHP files
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r file; do
            echo "Linting $file"
            if ! php -l "$file"; then
              failed=1
            fi
          done < <(find . -type f -name '*.php' -not -path './.git/*' | sort)
          exit "$failed"


  integration_smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, fileinfo
          tools: none
      - name: Run marketplace integration smoke test
        run: php tests/integration_smoke.php
